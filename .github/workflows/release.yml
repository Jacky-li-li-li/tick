name: release

# 打 tag（v0.1.0 这种）→ 构建 macOS 安装包并挂到 GitHub Release；
# 手动 workflow_dispatch → 只构建，产物作为 Artifacts 下载（不建 Release）。
#
# 签名 / 公证沿用 Jacky-li-li-li/Look 那套 Secrets（名字保持一致，值从同一份证书来）：
#   MAC_CERTS                    Developer ID Application 证书 .p12 的 base64
#                               导出：Keychain Access → 选中证书+私钥 → 导出 .p12 →
#                               base64 -i 证书.p12 | pbcopy → 粘到 Secret
#   MAC_CERT_PASSWORD            导出 .p12 时设置的密码
#   APPLE_ID                     公证用 Apple ID
#   APPLE_APP_SPECIFIC_PASSWORD  appleid.apple.com 生成的 App-Specific 密码
#   APPLE_TEAM_ID                Apple Developer Team ID（10 位）
# 没配也能跑：自动退化成未签名包（README 有首次打开放行说明）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      MAC_CERTS: ${{ secrets.MAC_CERTS }}
      MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # 版本从 package.json 的 packageManager 读；不要再传 version，否则 action 报「多个 pnpm 版本」
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tag 和 package.json 的版本必须一致。v0.1.5 之前全靠手工对齐两个 package.json，
      # 漏一次就发出版本号对不上的包，让 CI 来挡。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./apps/desktop/package.json').version")
          root=$(node -p "require('./package.json').version")
          if [ "$tag" != "$app" ] || [ "$tag" != "$root" ]; then
            echo "::error::tag=$tag, apps/desktop/package.json=$app, package.json=$root"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 与两个 package.json 的 $app 一致"

      - run: pnpm typecheck
      - run: pnpm test

      # 与 Look 一致：证书导入临时 keychain，electron-builder 自动发现并签名 + 公证
      - name: 导入 macOS 签名证书
        if: ${{ env.MAC_CERTS != '' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      # 签名 + 公证都在 electron-builder 里（build.mac.notarize: true）。
      # 不在这里盲目重试：0.1.1 那次把一个确定性失败重试了三次（实测 406 秒），
      # 只是把每次诊断的延迟乘三，还附带三份一样的报错。
      - name: 构建 dmg / zip（arm64 + x64）
        run: |
          if [ -n "$MAC_CERTS" ]; then
            pnpm --filter @tick/desktop dist
          else
            echo "::warning::未配置 MAC_CERTS，产出未签名包（用户首次打开需按 README 放行）"
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @tick/desktop dist
          fi

      # 闸门。签名和公证之间本来没有任何检查，所以 notarytool 只会回一句
      # "The binary is not signed with a valid Developer ID certificate"，
      # 看不出是证书没被认出来、还是签名器漏掉了文件。这里把两边的证据都摊到
      # job summary 上（CI 日志要鉴权才能下载，summary 在网页上直接能看）。
      - name: 签名闸门（诊断）
        if: always()
        run: |
          {
            echo "### keychain 里 electron-builder 能看到的身份"
            echo '```'
            security list-keychains
            security find-identity -v -p codesigning || true
            echo '```'
            echo "### 产物里每个 Mach-O 的签名"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          identities=""
          while IFS= read -r line; do identities="${identities}${line}%0A"; done < <(security find-identity -v -p codesigning || true)
          echo "::notice title=keychain 里的签名身份::${identities}"

          inspected=0
          failed=0
          for app in apps/desktop/release/mac-*/Tick.app; do
            [ -d "$app" ] || continue
            inspected=$((inspected + 1))
            if node scripts/verify-signature.mjs "$app" > /tmp/sign-gate.txt 2>&1; then
              cat /tmp/sign-gate.txt >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            failed=1
            cat /tmp/sign-gate.txt >> "$GITHUB_STEP_SUMMARY"
            # job summary 只有网页能看，日志要鉴权才能下载。annotation 在运行页和
            # commit 页都能直接看到，也是 CI 之外的程序唯一能读到的出口。
            body=""
            while IFS= read -r line; do body="${body}${line}%0A"; done < /tmp/sign-gate.txt
            echo "::error title=签名闸门::${body}"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$inspected" = 0 ]; then
            echo "没有找到 .app：构建没走到打包阶段" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=签名闸门::没有找到 .app，构建没走到打包阶段"
            exit 1
          fi
          exit "$failed"

      # 产物校验：签名过的要验签、资源要真的进包（magpie 的做法）
      - name: 校验产物
        run: |
          set -euo pipefail
          for app in apps/desktop/release/mac-*/Tick.app; do
            echo "== $app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
            codesign --verify --strict --verbose=2 "$app"
            spctl -a -vvv --type execute "$app" || true
            [ -f "$app/Contents/Resources/app.asar" ] || { echo "app.asar 缺失"; exit 1; }
            [ -f "$app/Contents/Resources/resources/tray-icon.png" ] || { echo "托盘图标没进包（extraResources）"; exit 1; }
          done
          if [ -n "${MAC_CERTS:-}" ]; then
            for app in apps/desktop/release/mac-*/Tick.app; do xcrun stapler validate "$app"; done
          fi

      # 真启动一次，抓主进程的 ready-to-show：避免"签过了但打不开"
      - name: 启动冒烟
        run: |
          set -euo pipefail
          BIN=apps/desktop/release/mac-arm64/Tick.app/Contents/MacOS/Tick
          "$BIN" --no-sandbox > /tmp/tick-smoke.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 15); do
            if grep -q "ready-to-show" /tmp/tick-smoke.log; then ok=1; break; fi
            kill -0 "$PID" 2>/dev/null || break
            sleep 2
          done
          kill "$PID" 2>/dev/null || true
          head -40 /tmp/tick-smoke.log
          [ "$ok" = "1" ] || { echo "面板没起来（日志里没有 ready-to-show）"; exit 1; }

      - name: 生成 SHA256SUMS
        run: |
          cd apps/desktop/release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # latest-mac.yml 是 electron-updater 的应用内更新 feed，*.blockmap 是差量下载用；
          # 少了它们，应用内检查更新会查不到新版本 / 退化成全量下载
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          generate_release_notes: true

      - name: 手动触发的产物（Artifacts）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tick-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
